<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Login — Azentio Finance</title>
<link rel="stylesheet" href="css/styles.css?v=1788177009403">
</head>
<body>
<div class="device">
  <div class="screen">
<div class="notch"></div><div class="statusbar"><span>9:41</span><div class="icons">
  <svg class="icon-signal" viewBox="0 0 18 12" width="18" height="12" fill="currentColor"><rect x="0" y="7" width="3" height="5" rx=".5"/><rect x="5" y="5" width="3" height="7" rx=".5"/><rect x="10" y="3" width="3" height="9" rx=".5"/><rect x="15" y="0" width="3" height="12" rx=".5"/></svg>
  <svg class="icon-battery" viewBox="0 0 25 12" width="22" height="11" fill="none"><rect x="0.5" y="0.5" width="20" height="11" rx="2.5" stroke="currentColor"/><rect x="2" y="2" width="17" height="8" rx="1" fill="currentColor"/><rect x="21.5" y="4" width="2" height="4" rx="1" fill="currentColor"/></svg>
</div></div>
  <div class="page ">
    <div class="app-header"><a class="icon-btn" href="index.html" onclick="return true"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7" /></svg></a><div class="title">Login</div></div>
    <div class="body">
    <div class="h2">Welcome back</div>
    <div class="p">Log in with your mobile number and password to continue.</div>
    <form data-validate>
      <div class="field phone-field" data-phone-field>
    <label>Mobile number</label>
    <div class="phone-input-row">
      <button type="button" class="country-select" data-country-toggle aria-label="Select country code">
        <span class="flag" data-country-flag>🇸🇦</span><span class="dial-code" data-country-code>+966</span><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
      </button>
      <div class="divider"></div>
      <input class="input phone-number-input" type="tel" inputmode="numeric" required data-mask="phone-local" data-validate="phone-local">
    </div>
    <div class="error-msg"></div>
    <div class="country-dropdown" data-country-dropdown>
      <div class="country-search"><input type="text" placeholder="Search country" data-country-search></div>
      <div class="country-list" data-country-list></div>
    </div>
  </div>
      <div class="field"><div class="input-wrap"><input class="input" type="password" placeholder="••••••••" required><button type="button" class="pw-toggle" data-pw-toggle tabindex="-1" aria-label="Show password"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z" /><circle cx="12" cy="12" r="3"/></svg></button></div><label>Password</label><div class="error-msg"></div></div>
    </form>
    <div class="small" style="margin-top:4px;"><a href="#" style="color:var(--primary-dark);font-weight:700;">Forgot password?</a></div></div>
    <div class="footer"><a class="btn btn-primary" href="home.html" data-nav ><span class="label">Login</span><span class="spinner"></span></a><a class="btn-link" href="biometric-login.html" data-nav >Use biometric login instead</a><a class="btn-link" href="sign-up.html" data-nav >Don't have an account? Sign up</a></div>
    
  </div>
  <div class="home-indicator"></div>
  </div>
</div>
<script src="js/app.js"></script>
</body>
</html>
