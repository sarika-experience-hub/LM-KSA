<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Azentio Finance</title>
<link rel="stylesheet" href="css/styles.css">
<style>
  .splash-screen{ background:var(--primary-dark); }
  .splash-screen .statusbar{ color:#fff; }
  .splash-page{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; position:relative; overflow:hidden; background:var(--primary-dark); }
  .splash-logo-wrap{ position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; gap:16px; animation:splashIn .7s cubic-bezier(.34,1.56,.64,1) both; }
  .splash-logo{ height:46px; width:auto; }
  .splash-tagline{ font-size:12.5px; letter-spacing:.06em; text-transform:uppercase; color:rgba(255,255,255,.65); font-weight:600; }
  @keyframes splashIn{ from{ opacity:0; transform:translateY(10px) scale(.94); } to{ opacity:1; transform:translateY(0) scale(1); } }
  .splash-loader{ position:absolute; bottom:92px; display:flex; gap:6px; }
  .splash-loader span{ width:7px; height:7px; border-radius:50%; background:rgba(255,255,255,.55); animation:splashDot 1.2s ease-in-out infinite both; }
  .splash-loader span:nth-child(2){ animation-delay:.15s; }
  .splash-loader span:nth-child(3){ animation-delay:.3s; }
  @keyframes splashDot{ 0%,80%,100%{ opacity:.3; transform:scale(.8);} 40%{ opacity:1; transform:scale(1);} }
  .splash-corp{ position:absolute; z-index:1; bottom:32px; font-size:11px; letter-spacing:.04em; color:rgba(255,255,255,.55); font-weight:600; }
  .splash-corp b{ color:#fff; font-weight:800; }
  .home-indicator.on-dark{ background:#fff; opacity:.7; }
</style>
</head>
<body>
<div class="device">
  <div class="screen splash-screen">
    <div class="notch"></div>
    <div class="statusbar"><span>9:41</span><div class="icons">
      <svg class="icon-signal" viewBox="0 0 18 12" width="18" height="12" fill="currentColor"><rect x="0" y="7" width="3" height="5" rx=".5"/><rect x="5" y="5" width="3" height="7" rx=".5"/><rect x="10" y="3" width="3" height="9" rx=".5"/><rect x="15" y="0" width="3" height="12" rx=".5"/></svg>
      <svg class="icon-battery" viewBox="0 0 25 12" width="22" height="11" fill="none"><rect x="0.5" y="0.5" width="20" height="11" rx="2.5" stroke="currentColor"/><rect x="2" y="2" width="17" height="8" rx="1" fill="currentColor"/><rect x="21.5" y="4" width="2" height="4" rx="1" fill="currentColor"/></svg>
    </div></div>
    <div class="splash-page" id="splashPage">
      <div class="splash-logo-wrap">
        <img src="images/logo-splash.svg" alt="Azentio Finance" class="splash-logo">
        <div class="splash-tagline">Smarter loans, stronger tomorrow</div>
      </div>
      <div class="splash-loader"><span></span><span></span><span></span></div>
      <div class="splash-corp">Powered by <b>Azentio</b></div>
    </div>
    <div class="home-indicator on-dark"></div>
  </div>
</div>
<script>
  setTimeout(function(){
    var p = document.getElementById('splashPage');
    if(p){ p.style.transition = 'opacity .35s ease'; p.style.opacity = '0'; }
    setTimeout(function(){ location.href = 'splash.html'; }, 350);
  }, 2200);
</script>
</body>
</html>
