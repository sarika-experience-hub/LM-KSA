<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Create Password — Azentio Finance</title>
<link rel="stylesheet" href="css/styles.css?v=1788177009403">
</head>
<body>
<div class="device">
  <div class="screen">
<div class="notch"></div><div class="statusbar"><span>9:41</span><div class="icons">
  <svg class="icon-signal" viewBox="0 0 18 12" width="18" height="12" fill="currentColor"><rect x="0" y="7" width="3" height="5" rx=".5"/><rect x="5" y="5" width="3" height="7" rx=".5"/><rect x="10" y="3" width="3" height="9" rx=".5"/><rect x="15" y="0" width="3" height="12" rx=".5"/></svg>
  <svg class="icon-battery" viewBox="0 0 25 12" width="22" height="11" fill="none"><rect x="0.5" y="0.5" width="20" height="11" rx="2.5" stroke="currentColor"/><rect x="2" y="2" width="17" height="8" rx="1" fill="currentColor"/><rect x="21.5" y="4" width="2" height="4" rx="1" fill="currentColor"/></svg>
</div></div>
  <div class="page ">
    <div class="app-header"><a class="icon-btn" href="nafath-success.html" onclick="return true"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7" /></svg></a><div class="title">Create Password</div></div>
    <div class="body">
    <div class="h2">Create a password</div>
    <div class="p">Use at least 8 characters, with a number and a symbol.</div>
    <form data-validate>
      <div class="field"><div class="input-wrap"><input class="input" type="password" placeholder="••••••••" required data-role="password-primary"><button type="button" class="pw-toggle" data-pw-toggle tabindex="-1" aria-label="Show password"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z" /><circle cx="12" cy="12" r="3"/></svg></button></div><label>Password</label><div class="error-msg"></div></div>
      <div class="pw-strength"><div class="progress" style="flex:1;margin:0 10px 0 0;"><div data-pw-bar style="width:8%;background:var(--line);"></div></div><span class="small" data-pw-label></span></div>
      <ul class="pw-rules">
        <li data-rule="len"><span class="rule-ico">○</span>At least 8 characters</li>
        <li data-rule="num"><span class="rule-ico">○</span>Contains a number</li>
        <li data-rule="sym"><span class="rule-ico">○</span>Contains a symbol</li>
        <li data-rule="case"><span class="rule-ico">○</span>Upper &amp; lowercase letters</li>
      </ul>
      <div class="field"><div class="input-wrap"><input class="input" type="password" placeholder="••••••••" required><button type="button" class="pw-toggle" data-pw-toggle tabindex="-1" aria-label="Show password"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z" /><circle cx="12" cy="12" r="3"/></svg></button></div><label>Confirm password</label><div class="error-msg"></div></div>
    </form></div>
    <div class="footer"><a class="btn btn-primary" href="create-pin.html" data-nav ><span class="label">Continue</span><span class="spinner"></span></a></div>
    
  </div>
  <div class="home-indicator"></div>
  </div>
</div>
<script src="js/app.js"></script>
</body>
</html>
