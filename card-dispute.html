<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dispute Transaction — Azentio Finance</title>
<link rel="stylesheet" href="css/styles.css?v=1788177009403">
</head>
<body>
<div class="device">
  <div class="screen">
<div class="notch"></div><div class="statusbar"><span>9:41</span><div class="icons">
  <svg class="icon-signal" viewBox="0 0 18 12" width="18" height="12" fill="currentColor"><rect x="0" y="7" width="3" height="5" rx=".5"/><rect x="5" y="5" width="3" height="7" rx=".5"/><rect x="10" y="3" width="3" height="9" rx=".5"/><rect x="15" y="0" width="3" height="12" rx=".5"/></svg>
  <svg class="icon-battery" viewBox="0 0 25 12" width="22" height="11" fill="none"><rect x="0.5" y="0.5" width="20" height="11" rx="2.5" stroke="currentColor"/><rect x="2" y="2" width="17" height="8" rx="1" fill="currentColor"/><rect x="21.5" y="4" width="2" height="4" rx="1" fill="currentColor"/></svg>
</div></div>
  <div class="page ">
    <div class="app-header"><a class="icon-btn" href="card-transaction-details.html" onclick="return true"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7" /></svg></a><div class="title">Dispute</div></div>
    <div class="body">
    <div class="h2">Dispute this transaction</div>
    <div class="p">STC · SAR 172.50 · 7 Sep 2026</div>

    <div class="h3">What happened?</div>
    <div class="pick-list" data-pick-group="dispute">
      <button type="button" class="pick-item on" data-pick-href="card-dispute-sent.html">
        <span class="pick-radio"></span>
        <span class="pick-body">
          <span class="pick-t">I didn't make this transaction</span>
          <span class="pick-d">We'll block your card straight away and issue a replacement.</span>
        </span>
      </button>
      <button type="button" class="pick-item" data-pick-href="card-dispute-sent.html">
        <span class="pick-radio"></span>
        <span class="pick-body">
          <span class="pick-t">Charged the wrong amount</span>
          <span class="pick-d">The merchant took more than agreed.</span>
        </span>
      </button>
      <button type="button" class="pick-item" data-pick-href="card-dispute-sent.html">
        <span class="pick-radio"></span>
        <span class="pick-body">
          <span class="pick-t">Charged twice</span>
          <span class="pick-d">The same purchase appears more than once.</span>
        </span>
      </button>
      <button type="button" class="pick-item" data-pick-href="card-dispute-sent.html">
        <span class="pick-radio"></span>
        <span class="pick-body">
          <span class="pick-t">Goods or service never arrived</span>
          <span class="pick-d">You paid but didn't receive what you bought.</span>
        </span>
      </button>
    </div>

    <div class="field"><textarea class="input" rows="3" placeholder="Tell us what happened"></textarea><label>Details (optional)</label></div>

    <div class="hint hint-strong">We acknowledge every dispute within 2 working days and resolve within 10. If the charge is reversed, the amount returns to your card balance.</div>
    <div class="hint">Raising a dispute does not pause your installments.</div></div>
    <div class="footer"><a class="btn btn-primary" href="card-dispute-sent.html" data-nav data-pick-cta="dispute"><span class="label">Submit dispute</span><span class="spinner"></span></a></div>

  </div>
  <div class="home-indicator"></div>
  </div>
</div>
<script src="js/app.js"></script>
</body>
</html>
