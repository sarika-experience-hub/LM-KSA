<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your Details — Azentio Finance</title>
<link rel="stylesheet" href="css/styles.css?v=1788177009403">
</head>
<body>
<div class="device">
  <div class="screen">
<div class="notch"></div><div class="statusbar"><span>9:41</span><div class="icons">
  <svg class="icon-signal" viewBox="0 0 18 12" width="18" height="12" fill="currentColor"><rect x="0" y="7" width="3" height="5" rx=".5"/><rect x="5" y="5" width="3" height="7" rx=".5"/><rect x="10" y="3" width="3" height="9" rx=".5"/><rect x="15" y="0" width="3" height="12" rx=".5"/></svg>
  <svg class="icon-battery" viewBox="0 0 25 12" width="22" height="11" fill="none"><rect x="0.5" y="0.5" width="20" height="11" rx="2.5" stroke="currentColor"/><rect x="2" y="2" width="17" height="8" rx="1" fill="currentColor"/><rect x="21.5" y="4" width="2" height="4" rx="1" fill="currentColor"/></svg>
</div></div>
  <div class="page ">
    <div class="app-header"><a class="icon-btn" href="sign-up-otp-success.html" onclick="return true"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7" /></svg></a><div class="title">Your Details</div></div>
    <div class="body">
    <div class="stepper-wrap">
    <div class="stepper" data-current="3" data-total="3"></div>
    <div class="step-label"><span>Step <b>3</b> of 3</span><span>Your Details</span></div>
  </div>
    <div class="h2">Complete your profile</div>
    <div class="p">Almost there — just a few more details to register.</div>
    <form data-validate>
      <div class="field"><input class="input" type="text" placeholder="National / Iqama ID" required data-mask="digits" data-maxlen="10" data-validate="saudi-id" inputmode="numeric"><label>ID number</label><div class="error-msg"></div></div>
      <div class="field date-field" data-date-field>
    <input class="input" data-date-display readonly placeholder="Date of birth">
    <label>Date of birth</label>
    <div class="suffix-icon icon-accent"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" stroke="none"><rect x="4" y="5" width="16" height="15" rx="3"/><rect x="7" y="2" width="2" height="4" rx="1"/><rect x="15" y="2" width="2" height="4" rx="1"/></svg></div>
    <div class="error-msg"></div>
  </div>
  <div class="sheet-backdrop" data-date-sheet>
    <div class="sheet-panel">
      <div class="sheet-handle"></div>
      <div class="sheet-title">Select your date of birth</div>
      <div class="sheet-sub">You must be 18 or older to apply.</div>
      <div class="date-select-row">
        <select data-day></select>
        <select data-month></select>
        <select data-year></select>
      </div>
      <div class="sheet-age-warn">You must be at least 18 years old to continue.</div>
      <a class="btn btn-primary" data-date-confirm><span class="label">Confirm</span></a>
      <a class="btn btn-ghost" data-date-cancel style="margin-top:4px;"><span class="label">Cancel</span></a>
    </div>
  </div>
      <div class="field"><input class="input" type="email" placeholder="name@email.com" data-validate="email"><label>Email address (optional)</label><div class="error-msg"></div></div>
    </form></div>
    <div class="footer"><a class="btn btn-primary" href="terms-conditions.html" data-nav ><span class="label">Create account</span><span class="spinner"></span></a></div>
    
  </div>
  <div class="home-indicator"></div>
  </div>
</div>
<script src="js/app.js"></script>
</body>
</html>
